# LLM profiles — pick one with --llm <name> (or per role below).
# Keys/secrets are NEVER written here: each profile names an env var that lives in .env
#
# backend types:
#   openai_compat   : any OpenAI-compatible HTTP API (OpenAI, OpenRouter, Azure, gateways)
#   anthropic       : Anthropic Messages API
#   opencode_server : a running `opencode serve` (uses whatever login opencode has, e.g. ChatGPT)
#   command         : any CLI that reads the prompt on stdin and prints the answer (opencode run, codex exec, claude -p, ...)

profiles:
  mock:                      # offline pipeline test only (random-ish decisions, no network)
    backend: mock
    timeout_s: 5

  # ---- competition-allowed models via CodeCraft (OpenAI-compatible). Key in .env: CODECRAFT_API_KEY ----
  sol56:
    backend: openai_compat
    base_url: https://codecraftapi.com/v1
    model: gpt-5.6-sol
    api_key_env: CODECRAFT_API_KEY
    reasoning_effort: low
    timeout_s: 60
  terra56:
    backend: openai_compat
    base_url: https://codecraftapi.com/v1
    model: gpt-5.6-terra
    api_key_env: CODECRAFT_API_KEY
    reasoning_effort: low
    timeout_s: 60
  luna56:
    backend: openai_compat
    base_url: https://codecraftapi.com/v1
    model: gpt-5.6-luna
    api_key_env: CODECRAFT_API_KEY
    reasoning_effort: low
    timeout_s: 45
  sol56_medium:
    backend: openai_compat
    base_url: https://codecraftapi.com/v1
    model: gpt-5.6-sol
    api_key_env: CODECRAFT_API_KEY
    reasoning_effort: medium
    timeout_s: 90

  sol_opencode:
    backend: opencode_server
    url: http://127.0.0.1:4096
    provider_id: openai
    model_id: gpt-6.1-sol
    password_env: OPENCODE_SERVER_PASSWORD     # optional
    timeout_s: 45

  sol_opencode_cli:
    backend: command
    cmd: ["opencode", "run", "-m", "openai/gpt-6.1-sol", "--format", "json"]
    prompt_via: arg            # opencode run takes the message as an argument
    timeout_s: 90

  sol_api:
    backend: openai_compat
    base_url: https://api.openai.com/v1
    model: gpt-6.1-sol
    api_key_env: OPENAI_API_KEY
    reasoning_effort: low
    timeout_s: 45

  sol_openrouter:
    backend: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-6.1-sol
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 45

  claude_api:
    backend: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 45

  # ---- live run: BoxAPI (OpenAI-compatible). Key in .env: BOXAPI_API_KEY. Own USD ledger (ledgers.boxapi) ----
  box_sol61:
    backend: openai_compat
    base_url: https://ai.boxapi.ir/ai/v1
    model: gpt-6.1-sol
    api_key_env: BOXAPI_API_KEY
    reasoning_effort: low          # gpt-6.1-sol: low|medium|high|xhigh|max (no none/minimal)
    timeout_s: 40
    max_output_tokens: 700
    completion_headroom: 2500      # max_completion_tokens = 700 + 2500
    ledger: boxapi
    cache: false                   # live prompts are unique; never reuse an old answer
    price_usd_per_m: {input: 2.0, cached_input: 0.10, output: 10.0}   # public list price; verify vs BoxAPI dashboard
    # user_agent: "opencode/1.19.3"   # only if Cloudflare blocks the default
  box_sol6:
    backend: openai_compat
    base_url: https://ai.boxapi.ir/ai/v1
    model: gpt-6-sol
    api_key_env: BOXAPI_API_KEY
    reasoning_effort: low
    timeout_s: 40
    max_output_tokens: 700
    completion_headroom: 2500
    ledger: boxapi
    cache: false
    price_usd_per_m: {input: 2.0, cached_input: 0.20, output: 10.0}
  box_sol56:
    backend: openai_compat
    base_url: https://ai.boxapi.ir/ai/v1
    model: gpt-5.6-sol
    api_key_env: BOXAPI_API_KEY
    reasoning_effort: low
    timeout_s: 45
    max_output_tokens: 700
    completion_headroom: 2500
    ledger: boxapi
    cache: false
    price_usd_per_m: {input: 4.0, cached_input: 0.40, output: 20.0}

# Which profile each agent role uses. A list = fallback chain (next one is tried if the first fails).
# A single-name --llm override keeps the chain members that share its ledger as fallbacks.
roles:
  decide:        [box_sol61, box_sol6, box_sol56]
  native:        [box_sol61, box_sol6, box_sol56]
  reflect:       [box_sol61, box_sol6, box_sol56]
  risk_manager:  [sol56, terra56]      # C3 only (offline)
  orchestrator:  [sol56, terra56]      # C6 only (offline)
  card_eval:     [luna56]

defaults:
  temperature: 0
  json_retries: 1
  max_parallel_calls: 2
  calls_per_hour: 120
  max_output_tokens: 600          # hard cap; protects subscription/plan limits
  cache: true                     # global default stays true (offline tests/replay); box profiles override with false
  ledgers:                        # ledger dir: env LLM_LEDGER_DIR (default .cache)
    codecraft: {token_cap: 900000}                              # whole CodeCraft budget is 1M tokens; safety margin
    boxapi:    {usd_cap: 2.7, low_priority_stop_frac: 0.8}      # env LLM_BUDGET_USD overrides usd_cap
